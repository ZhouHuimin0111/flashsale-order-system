server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    discovery:
      client:
        simple:
          instances:
            order-service:
              - uri: ${ORDER_SERVICE_1:http://localhost:8081}
              - uri: ${ORDER_SERVICE_2:http://localhost:8082}
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
management:
  endpoints:
    web:
      exposure:
        include: health,info
