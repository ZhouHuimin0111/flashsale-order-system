server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/flashsale?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USER:flashsale}
    password: ${DB_PASSWORD:local-demo-password}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  jackson:
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 30s
app:
  mq:
    nameserver: ${MQ_NAMESERVER:localhost:9876}
    topic: flashsale-orders
    consumer-group: flashsale-order-writers
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
